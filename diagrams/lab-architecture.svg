<title id="title">BWA Stay Hotel Lab Architecture</title>
<desc id="desc">VirtualBox hosts Windows Server 2025 and a domain-joined Windows 11 client. The server provides Active Directory, DNS, Group Policy, file services, and IIS.</desc>
