<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">BWA Stay Hotel Troubleshooting Process</title>
<desc id="desc">Confirm the issue, collect evidence, isolate the cause, apply the fix, test and verify, and document the resolution.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#f8fafc"/>
<text x="50" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Troubleshooting Process</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="55" y="105" width="300" height="105" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="205" y="148" font-size="22" font-weight="700" fill="#0f172a">1. Confirm the Issue</text><text x="205" y="181" font-size="17" fill="#475569">Reproduce the problem</text>
<rect x="450" y="105" width="300" height="105" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="600" y="148" font-size="22" font-weight="700" fill="#0f172a">2. Collect Evidence</text><text x="600" y="181" font-size="17" fill="#475569">Errors • settings • logs • commands</text>
<rect x="845" y="105" width="300" height="105" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="995" y="148" font-size="22" font-weight="700" fill="#0f172a">3. Isolate the Cause</text><text x="995" y="181" font-size="17" fill="#475569">Account • DNS • GPO • permissions</text>
<rect x="845" y="315" width="300" height="105" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="995" y="358" font-size="22" font-weight="700" fill="#0f172a">4. Apply the Fix</text><text x="995" y="391" font-size="17" fill="#475569">Make the required change</text>
<rect x="450" y="315" width="300" height="105" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="4"/><text x="600" y="358" font-size="22" font-weight="700" fill="#0f172a">5. Test and Verify</text><text x="600" y="391" font-size="17" fill="#475569">Confirm the expected result</text>
<rect x="55" y="315" width="300" height="105" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="4"/><text x="205" y="358" font-size="22" font-weight="700" fill="#0f172a">6. Document Resolution</text><text x="205" y="391" font-size="17" fill="#475569">Evidence • notes • closure</text>
</g>
<path d="M355 157H430M750 157H825M995 210V295M845 367H770M450 367H375" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a)"/>
<path d="M600 315V265H600V230" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#a)"/>
<text x="625" y="275" font-family="Arial,sans-serif" font-size="16" fill="#475569">If testing fails, investigate again</text>
<rect x="130" y="515" width="940" height="110" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 7"/>
<text x="600" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Case Study Evidence</text>
<text x="600" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Issue reported → investigation → root cause → resolution → after evidence → verification</text>
</svg>