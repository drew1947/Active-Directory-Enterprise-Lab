<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">BWA Stay Hotel OU and Role-Based Access Model</title>
<desc id="desc">Users are organized by department, assigned to matching security groups, and given access to approved resources.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#f8fafc"/>
<text x="50" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">OU and Role-Based Access Model</text>
<rect x="430" y="95" width="340" height="75" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
<text x="600" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">BWA Stay Hotel</text>
<path d="M600 170V210M165 210H1035" stroke="#64748b" stroke-width="4"/>
<path d="M165 210V240M380 210V240M600 210V240M820 210V240M1035 210V240" stroke="#64748b" stroke-width="4"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="65" y="240" width="200" height="90" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="165" y="279" font-size="21" font-weight="700" fill="#0f172a">Department OUs</text><text x="165" y="307" font-size="17" fill="#475569">Users by department</text>
<rect x="280" y="240" width="200" height="90" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="380" y="279" font-size="21" font-weight="700" fill="#0f172a">Computers</text><text x="380" y="307" font-size="17" fill="#475569">Separate OU</text>
<rect x="500" y="240" width="200" height="90" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="600" y="279" font-size="21" font-weight="700" fill="#0f172a">Disabled Users</text><text x="600" y="307" font-size="17" fill="#475569">Offboarded accounts</text>
<rect x="720" y="240" width="200" height="90" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="820" y="279" font-size="21" font-weight="700" fill="#0f172a">Security Groups</text><text x="820" y="307" font-size="17" fill="#475569">Job-based membership</text>
<rect x="935" y="240" width="200" height="90" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="1035" y="279" font-size="21" font-weight="700" fill="#0f172a">Management</text><text x="1035" y="307" font-size="17" fill="#475569">Approved roles</text>
<rect x="70" y="430" width="285" height="170" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="212" y="472" font-size="23" font-weight="700" fill="#0f172a">Department Users</text><text x="212" y="512" font-size="18" fill="#334155">Front Desk • Housekeeping</text><text x="212" y="544" font-size="18" fill="#334155">Security • Maintenance</text><text x="212" y="576" font-size="18" fill="#334155">HR • Accounting • IT</text>
<rect x="457" y="430" width="285" height="170" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="599" y="472" font-size="23" font-weight="700" fill="#0f172a">Security Groups</text><text x="599" y="512" font-size="18" fill="#334155">Role-based membership</text><text x="599" y="544" font-size="17" fill="#475569">Access assigned to groups</text><text x="599" y="576" font-size="17" fill="#475569">instead of individual users</text>
<rect x="845" y="430" width="285" height="170" rx="20" fill="#ecfdf5" stroke="#16a34a" stroke-width="4"/><text x="987" y="472" font-size="23" font-weight="700" fill="#0f172a">Approved Resources</text><text x="987" y="512" font-size="18" fill="#334155">Shared folders</text><text x="987" y="544" font-size="18" fill="#334155">Mapped drives • IIS</text><text x="987" y="576" font-size="18" fill="#334155">Department access</text>
</g>
